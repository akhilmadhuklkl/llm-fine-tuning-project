name: Data quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight validation dependencies
        run: python -m pip install pyyaml jsonschema

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run unified quality gate
        run: python scripts/run_quality_gate.py
