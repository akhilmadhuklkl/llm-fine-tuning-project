# Minimum-resource LoRA smoke-test configuration.
model_config: configs/model.yaml
train_file: data/processed/train_chat.jsonl
validation_file: data/processed/validation_chat.jsonl
output_dir: models/smoke-test
max_seq_length: 256
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 0.0002
num_train_epochs: 1
max_steps: 1
logging_steps: 1
save_strategy: "no"
evaluation_strategy: "no"
fp16: false
bf16: false
gradient_checkpointing: false
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
