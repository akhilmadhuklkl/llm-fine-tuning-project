# Longer quality experiment; run only on an accelerated or dedicated environment.
model_config: configs/model_local.yaml
train_file: data/processed/train_chat.jsonl
validation_file: data/processed/validation_chat.jsonl
output_dir: models/smollm2-lora-exp002
max_seq_length: 256
assistant_only_loss: true
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 0.0002
num_train_epochs: 1
max_steps: 20
eval_every_n_steps: 5
logging_steps: 1
save_strategy: "no"
evaluation_strategy: "no"
fp16: false
bf16: false
gradient_checkpointing: false
lora_r: 4
lora_alpha: 8
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
