model_config: configs/model_tiny.yaml
train_file: data/processed/train_chat.jsonl
validation_file: data/processed/validation_chat.jsonl
output_dir: models/tiny-smoke-output
max_seq_length: 256
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 0.0002
num_train_epochs: 1
max_steps: 1
logging_steps: 1
save_strategy: "no"
evaluation_strategy: "no"
fp16: false
bf16: false
gradient_checkpointing: false
lora_r: 4
lora_alpha: 8
lora_dropout: 0.05
lora_target_modules:
  - c_attn
  - c_proj
